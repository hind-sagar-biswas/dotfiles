source = ~/.config/hypr/colors-hyprlock.conf

background {
    monitor = eDP-1
    path = ~/Wallpapers/wall.jpg
    color = $background
    blur_passes = 4
}

image {
    monitor =
    path = ~/Wallpapers/pic.jpg
    size = 150
    rounding = -1
    border_color = $primary

    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor = eDP-1
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) 

    outer_color = $secondary
    check_color = $primary_solid
    fail_color = $error

    font_color = $text
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = Yōkoso, $USER
    color = $text
    font_size = 25
    font_family = Noto Sans

    position = 0, 80
    halign = center
    valign = center
}
